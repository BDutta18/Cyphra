name: Cyphra CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    env:
      CYPHRA_DEPLOYMENT_ENV: test
      NODE_ENV: test
      MIDNIGHT_NETWORK: preprod
      MIDNIGHT_RPC_URL: https://rpc.preprod.midnight.network
      MIDNIGHT_INDEXER_URI: ''
      CONTRACT_ADDRESS: '0xd72f60d3f297dc84078e19677b60e88759f9982a3ea3dbf87a387814cda034ad'
      NEXT_PUBLIC_MIDNIGHT_NETWORK: preprod
      NEXT_PUBLIC_MIDNIGHT_NETWORK_ID: preprod
      NEXT_PUBLIC_API_URL: 'https://cyphra-preprod-api.up.railway.app'
      NEXT_PUBLIC_INDEXER_URI: https://indexer.preprod.midnight.network/api/v4/graphql
      NEXT_PUBLIC_CYPHRA_CONTRACT_ADDRESS: '0xd72f60d3f297dc84078e19677b60e88759f9982a3ea3dbf87a387814cda034ad'
      NEXT_PUBLIC_MIDNIGHT_EXPLORER_URL: https://preprod.midnightexplorer.com

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Monorepo
        run: pnpm lint

      - name: Typecheck Monorepo
        run: pnpm typecheck

      - name: Build Shared & Contracts
        run: |
          pnpm --filter @cyphra/shared run build
          pnpm --filter @cyphra/contracts run build

      - name: Run Tests
        run: pnpm test
        env:
          CYPHRA_DEPLOYMENT_ENV: test
          NODE_ENV: test
          MIDNIGHT_NETWORK: preprod
          MIDNIGHT_RPC_URL: https://rpc.preprod.midnight.network
          MIDNIGHT_INDEXER_URI: ''
          CONTRACT_ADDRESS: '0xd72f60d3f297dc84078e19677b60e88759f9982a3ea3dbf87a387814cda034ad'

      - name: Build All Workspaces
        run: pnpm build

  # Creates a GitHub "Production" deployment so the environment shows as Active
  mark-production:
    name: Mark Production Deployment
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      deployments: write
      contents: read
    steps:
      - name: Create GitHub Deployment
        uses: chrnorm/deployment-action@v2
        id: deployment
        with:
          token: ${{ github.token }}
          environment: production
          initial-status: in_progress
          auto-inactive: true
          description: 'Cyphra DApp — Midnight Preprod on Vercel'
          environment-url: 'https://cyphra-two.vercel.app'

      - name: Mark Deployment Success
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          state: success
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          environment-url: 'https://cyphra-two.vercel.app'
          description: 'Live on cyphra-two.vercel.app'
