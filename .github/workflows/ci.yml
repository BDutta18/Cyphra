name: Cyphra CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    env:
      CYPHRA_DEPLOYMENT_ENV: test
      NODE_ENV: test
      MIDNIGHT_NETWORK: preprod
      MIDNIGHT_RPC_URL: https://rpc.preprod.midnight.network
      MIDNIGHT_INDEXER_URI: ''
      CONTRACT_ADDRESS: '0xcc4a29303a6521ef0881444ce30550d1dabccdd5d70da8c78463bb54ef96db3f'
      NEXT_PUBLIC_MIDNIGHT_NETWORK: preprod
      NEXT_PUBLIC_MIDNIGHT_NETWORK_ID: preprod
      NEXT_PUBLIC_API_URL: 'https://cyphra-preprod-api.up.railway.app'
      NEXT_PUBLIC_INDEXER_URI: https://indexer.preprod.midnight.network/api/v4/graphql
      NEXT_PUBLIC_CYPHRA_CONTRACT_ADDRESS: '0xcc4a29303a6521ef0881444ce30550d1dabccdd5d70da8c78463bb54ef96db3f'
      NEXT_PUBLIC_MIDNIGHT_EXPLORER_URL: https://preprod.midnightexplorer.com

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Monorepo
        run: pnpm lint

      - name: Typecheck Monorepo
        run: pnpm typecheck

      - name: Run Tests
        run: pnpm test
        env:
          CYPHRA_DEPLOYMENT_ENV: test
          NODE_ENV: test
          MIDNIGHT_INDEXER_URI: ''

      - name: Build All Workspaces
        run: pnpm build
